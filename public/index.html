<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XHS Link Reader</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, "Microsoft YaHei", sans-serif;
        color: #1f2937;
        background: #fafafa;
      }

      main {
        width: min(680px, calc(100vw - 32px));
        padding: 32px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 16px;
        line-height: 1.7;
      }

      code {
        padding: 2px 6px;
        border-radius: 4px;
        background: #f1f5f9;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>XHS Link Reader</h1>
      <p>小红书链接读取服务已启动。</p>
      <p>可用接口：<code>/api/xhs-card</code>、<code>/api/xhs-images</code>、<code>/api/mcp</code></p>
    </main>
  </body>
</html>
